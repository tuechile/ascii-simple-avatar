<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #201126;
  --panel: #2c1a35;
  --chip: #3a2645;
  --text: #f3e9ff;
  --muted: #a993b8;
  --card: #c7a9e3;
  --ink: #3e326f;
  --accent: #ff8fc7;
  --glyph: "Lucida Console", Monaco, Menlo, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "DM Mono", ui-monospace, monospace; }
header { text-align: center; padding: 2.5rem 1rem 1rem; }
h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); margin: 0; letter-spacing: -.02em; }
header p { color: var(--muted); margin: .4rem 0 0; }
main { display: flex; flex-wrap: wrap; gap: 2rem; padding: 1.5rem 16px 3rem; justify-content: center; align-items: flex-start; max-width: 1080px; margin: 0 auto; }
.stage { display: grid; gap: 1rem; justify-items: center; position: sticky; top: 1.5rem; }
.card { background: var(--card); color: var(--ink); border-radius: 16px; padding: 1.1rem; box-shadow: 0 0 0 4px #00000033, 0 20px 40px #0006; }
.art { display: grid; grid-template-columns: repeat(17, calc(var(--cell) * .82)); grid-auto-rows: var(--cell); font-family: var(--glyph); font-size: calc(var(--cell) * 1.3); line-height: var(--cell); font-weight: 700; }
.art span { text-align: center; }
.card .art { --cell: clamp(9px, 2.6vw, 13px); }
.meta { color: var(--muted); font-size: .8rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
button { font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: 999px; padding: .5rem 1rem; cursor: pointer; transition: transform .1s, background .15s; }
button:hover { background: #4a3358; }
button:active { transform: scale(.96); }
button.primary { background: var(--accent); color: var(--bg); font-weight: 500; }
.picker { flex: 1 1 420px; max-width: 600px; background: var(--panel); border-radius: 20px; padding: 1.25rem; display: grid; gap: 1.1rem; }
.groups { display: grid; gap: .7rem; }
.group { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.group b { font-weight: 400; color: var(--muted); font-size: .75rem; width: 4.2rem; text-transform: uppercase; letter-spacing: .08em; }
.group button { padding: .35rem .8rem; font-size: .85rem; }
.group button.active { background: var(--accent); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: .6rem; }
.tile { background: var(--card); color: var(--ink); border-radius: 14px; padding: .6rem .4rem .45rem; display: grid; gap: .35rem; justify-items: center; border: 3px solid transparent; }
.tile:hover { background: #d4bbec; }
.tile.active { border-color: var(--accent); }
.tile .art { --cell: 6px; }
.tile span.name { font-size: .72rem; }
.modes { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; width: fit-content; }
.modes button { background: transparent; padding: .35rem 1rem; }
.modes button.active { background: var(--card); color: var(--ink); }
.group button.on { box-shadow: inset 0 0 0 2px var(--accent); }
.playing { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; min-height: 2rem; }
.playing button { background: var(--card); color: var(--ink); font-size: .8rem; padding: .3rem .7rem; }
.hint { color: var(--muted); font-size: .75rem; margin: 0; }
.status { color: var(--accent); font-size: .8rem; min-height: 1.1em; }
[hidden] { display: none !important; }
@media (max-width: 700px) { .stage { position: static; } .group b { width: 100%; } }
</style>
</head>
<body>
<header>
<h1>ascii avatar</h1>
<p>dress up a tiny character</p>
</header>
<main>
<section class="stage">
<div class="card"><div class="art" id="art"></div></div>
<span class="meta" id="seed"></span>
<div class="actions">
<button class="primary" id="shuffle">shuffle</button>
<button id="copy">copy</button>
<button id="save">save .txt</button>
<button id="snap">from photo</button>
<input type="file" id="file" accept="image/*" capture="user" hidden>
</div>
<span class="status" id="status"></span>
</section>
<section class="picker">
<nav class="modes">
<button class="active" data-mode="dress">dress up</button>
<button data-mode="animate">animate</button>
</nav>
<div id="dress" class="groups">
<div class="groups" id="groups"></div>
<div class="grid" id="grid"></div>
</div>
<div id="animate" class="groups" hidden>
<p class="hint">pick a feature, then pick what it does. mix as many as you like.</p>
<div class="group" id="features"></div>
<div class="group" id="actions"></div>
<div class="playing" id="playing"></div>
</div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const GROUPS = {
  face: ["face", "line", "eyes", "glasses", "nose", "mouth", "cheeks"],
  hair: ["hair", "texture", "top"],
  outfit: ["outfit", "pattern", "ears"],
};
let state = { seed: 0, parts: {}, art: "" };
let slot = "face";
let motions = {};
let feature = "eyes";
let play = {};
let timer = null;

const query = (extra = {}) => "?" + new URLSearchParams({ seed: state.seed, ...state.parts, ...extra });
const get = async url => (await fetch(url)).json();

const draw = (el, art) => {
  el.replaceChildren(...[...art.replace(/\n/g, "")].map(ch => make("span", { textContent: ch })));
  return el;
};

const chip = (text, active, onclick, extra = "") => make("button", { textContent: text, className: (active ? "active " : "") + extra, onclick });

const tiles = async () => {
  const options = await get(`/options/${slot}` + query());
  $("grid").replaceChildren(...options.map(({ name, art }) => {
    const tile = make("button", { className: "tile" + (state.parts[slot] === name ? " active" : "") });
    tile.append(draw(make("div", { className: "art" }), art), make("span", { className: "name", textContent: name }));
    tile.onclick = () => { state.parts[slot] = name; show(); };
    return tile;
  }));
};

const tabs = () => {
  $("groups").replaceChildren(...Object.entries(GROUPS).map(([group, slots]) => {
    const row = make("div", { className: "group" });
    row.append(make("b", { textContent: group }), ...slots.map(name => chip(name, name === slot, () => { slot = name; tabs(); tiles(); })));
    return row;
  }));
};

const motionUi = () => {
  $("features").replaceChildren(make("b", { textContent: "feature" }), ...Object.keys(motions).map(name =>
    chip(name, name === feature, () => { feature = name; motionUi(); }, play[name] ? "on" : "")));
  $("actions").replaceChildren(make("b", { textContent: "action" }),
    chip("still", !play[feature], () => { delete play[feature]; animate(); }),
    ...motions[feature].map(action => chip(action, play[feature] === action, () => { play[feature] = action; animate(); })));
  const active = Object.entries(play);
  $("playing").replaceChildren(...active.map(([name, action]) =>
    make("button", { textContent: `${name} · ${action} ×`, onclick: () => { delete play[name]; animate(); } })));
  if (active.length) $("playing").append(chip("stop all", false, () => { play = {}; animate(); }));
};

const animate = async () => {
  motionUi();
  clearInterval(timer);
  const entries = Object.entries(play);
  if (!entries.length) return draw($("art"), state.art);
  const { fps, frames } = await get("/animate" + query({ play: entries.map(e => e.join(":")).join(",") }));
  let i = 0;
  const tick = () => draw($("art"), frames[i++ % frames.length]);
  tick();
  timer = setInterval(tick, 1000 / fps);
};

const apply = body => {
  state = body;
  $("seed").textContent = "seed " + state.seed;
  tabs();
  tiles();
  animate();
};

const show = async (fresh = false) => apply(await get("/avatar" + (fresh ? "" : query())));

const flash = (button, text) => {
  const old = button.textContent;
  button.textContent = text;
  setTimeout(() => button.textContent = old, 900);
};

const shrink = file => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 768 / Math.max(img.width, img.height));
    const canvas = make("canvas", { width: img.width * scale, height: img.height * scale });
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    resolve(canvas.toDataURL("image/jpeg", 0.85));
  };
  img.onerror = reject;
  img.src = URL.createObjectURL(file);
});

$("file").onchange = async () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  $("status").textContent = "reading your face...";
  try {
    const res = await fetch("/photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: await shrink(file) }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail);
    apply(body);
    $("status").textContent = "";
  } catch (error) {
    $("status").textContent = error.message || "could not read that photo";
  }
};

document.querySelectorAll(".modes button").forEach(button => button.onclick = () => {
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("active", b === button));
  $("dress").hidden = button.dataset.mode !== "dress";
  $("animate").hidden = button.dataset.mode !== "animate";
});

$("snap").onclick = () => $("file").click();
$("shuffle").onclick = () => show(true);
$("copy").onclick = async () => { await navigator.clipboard.writeText(state.art); flash($("copy"), "copied!"); };
$("save").onclick = () => {
  const link = make("a", { href: URL.createObjectURL(new Blob([state.art], { type: "text/plain" })), download: `avatar-${state.seed}.txt` });
  link.click();
};
get("/motions").then(body => { motions = body; show(true); });
</script>
</body>
</html>
