<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #9e2350;
  --pink: #e0849a;
  --pink-light: #eda5b5;
  --mustard: #d18f2a;
  --blue: #769fc2;
  --ink: #5a1230;
  --title: #f2b8ae;
  --glyph: "Lucida Console", Monaco, Menlo, "DejaVu Sans Mono", monospace;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; border-radius: 0; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--label); overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; padding: 0; cursor: pointer; background: none; }
button:focus-visible { outline: 3px solid var(--title); outline-offset: 2px; }
main { min-height: 100vh; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; padding: 2rem 16px; }
.diagram { justify-self: center; position: relative; width: min(330px, 80vw); aspect-ratio: 330 / 470; }
.block { position: absolute; left: calc(var(--x) * 100% / 330); top: calc(var(--y) * 100% / 470); width: calc(var(--w) * 100% / 330); height: calc(var(--h) * 100% / 470); background: var(--blue); transition: background .15s, opacity .15s; }
.block.feature { background: var(--mustard); }
.block:hover { background: #8fb4d4; }
.block.feature:hover { background: #e2a03c; }
.block.empty { opacity: .45; }
.block.active, .block.active:hover { background: var(--pink); opacity: 1; }
.stage { display: grid; justify-items: center; gap: 8px; }
.tools { display: flex; gap: 12px; }
.tool { width: 98px; height: 50px; background: var(--pink); display: grid; place-items: center; transition: background .15s; }
.tool:hover { background: var(--pink-light); }
.tool svg { width: 52px; height: 36px; }
.card { width: min(320px, 82vw); aspect-ratio: 320 / 408; background: var(--mustard); display: grid; place-items: center; }
.art { display: grid; grid-template-columns: repeat(var(--cols, 17), calc(var(--cell) * .82)); grid-auto-rows: var(--cell); font-family: var(--glyph); font-size: calc(var(--cell) * 1.25); line-height: var(--cell); font-weight: 700; color: var(--ink); }
.art span { text-align: center; }
.card .art { --cell: min(15px, 3.7vw); }
.status { color: var(--title); font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; min-height: 1.3em; }
h1 { margin: 0; color: var(--title); font-weight: 500; font-size: clamp(3rem, 8vw, 4.6rem); line-height: 1.15; letter-spacing: .14em; text-align: center; padding-left: .14em; }
.panel { position: fixed; right: 0; top: 12vh; height: 74vh; width: min(440px, 30vw); background: var(--pink); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .25s ease; z-index: 2; }
.panel.open { transform: none; }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px; }
.panel h2 { margin: 0; font-weight: 600; font-size: 2rem; letter-spacing: .14em; text-transform: uppercase; }
.close { width: 36px; height: 36px; background: var(--bg); position: relative; }
.close::before, .close::after { content: ""; position: absolute; left: 8px; top: 16px; width: 20px; height: 4px; background: var(--pink); transform: rotate(45deg); }
.close::after { transform: rotate(-45deg); }
.tabs { display: flex; gap: 8px; padding: 0 20px 16px; }
.tabs button { flex: 1; height: 40px; background: var(--pink-light); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 1.05rem; }
.tabs button.active { background: var(--bg); color: var(--pink); }
.body { overflow-y: auto; padding: 0 20px 20px; display: grid; gap: 20px; align-content: start; }
.body h3 { margin: 0 0 8px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.tile { background: var(--pink-light); aspect-ratio: 1; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 6px 4px 4px; transition: background .15s; }
.tile:hover { background: #f3bcc8; }
.tile.active { background: var(--mustard); }
.tile .name { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { height: 36px; padding: 0 14px; background: var(--pink-light); letter-spacing: .1em; text-transform: uppercase; font-size: .95rem; }
.chips button:hover { background: #f3bcc8; }
.chips button.active { background: var(--mustard); }
.chips button.stop { background: var(--bg); color: var(--pink); }
.hint { margin: 0; letter-spacing: .06em; }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; gap: 2.5rem; }
  .diagram { order: 2; width: min(280px, 72vw); }
  .panel { top: auto; bottom: 0; left: 0; width: 100%; height: 62vh; transform: translateY(105%); }
}
</style>
</head>
<body>
<main>
<section class="diagram" id="diagram" aria-label="pick a part"></section>
<section class="stage">
<div class="tools">
<button class="tool" id="shuffle" title="shuffle" aria-label="shuffle">
<svg viewBox="0 0 52 36"><rect x="9" y="1" width="34" height="34" fill="var(--bg)"/><circle cx="19" cy="9" r="3.5" fill="var(--pink)"/><circle cx="33" cy="9" r="3.5" fill="var(--pink)"/><circle cx="19" cy="18" r="3.5" fill="var(--pink)"/><circle cx="33" cy="18" r="3.5" fill="var(--pink)"/><circle cx="19" cy="27" r="3.5" fill="var(--pink)"/><circle cx="33" cy="27" r="3.5" fill="var(--pink)"/></svg>
</button>
<button class="tool" id="copy" title="copy" aria-label="copy">
<svg viewBox="0 0 52 36"><rect x="14" y="1" width="24" height="34" fill="var(--bg)"/><rect x="20" y="4" width="12" height="3" fill="var(--pink)"/></svg>
</button>
<button class="tool" id="snap" title="from photo" aria-label="from photo">
<svg viewBox="0 0 52 36"><rect x="2" y="2" width="48" height="32" fill="var(--bg)"/><circle cx="10" cy="9" r="4" fill="var(--pink)"/><circle cx="29" cy="19" r="9" fill="var(--pink)"/></svg>
</button>
<input type="file" id="file" accept="image/*" capture="user" hidden>
</div>
<div class="card"><div class="art" id="art"></div></div>
<span class="status" id="status"></span>
<h1>ASCII<br>AVATAR</h1>
</section>
</main>
<aside class="panel" id="panel" aria-live="polite">
<header><h2 id="heading"></h2><button class="close" id="close" aria-label="close"></button></header>
<nav class="tabs">
<button class="active" data-tab="dress">dress</button>
<button data-tab="animate">animate</button>
</nav>
<div class="body" id="dress"></div>
<div class="body" id="animate" hidden></div>
</aside>
<script>
const $ = id => document.getElementById(id);
const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const BLOCKS = {
  hair: { box: [32, 0, 270, 58], slots: { hair: "style", texture: "texture", top: "hat" }, motions: { hair: "hair", top: "hat" } },
  face: { box: [54, 65, 213, 214], slots: { face: "shape", line: "line" }, motions: { body: "whole avatar" } },
  ears: { box: [0, 120, 37, 82], slots: { ears: "ears" }, motions: { ears: "ears" } },
  eyes: { box: [139, 119, 51, 37], slots: { eyes: "eyes", glasses: "glasses" }, motions: { eyes: "eyes", glasses: "glasses" }, feature: true },
  cheeks: { box: [81, 169, 47, 45], slots: { cheeks: "cheeks" }, motions: { cheeks: "cheeks" }, feature: true },
  nose: { box: [165, 169, 17, 46], slots: { nose: "nose" }, motions: { nose: "nose" }, feature: true },
  mouth: { box: [113, 232, 88, 25], slots: { mouth: "mouth" }, motions: { mouth: "mouth" }, feature: true },
  body: { box: [27, 332, 303, 138], slots: { outfit: "shape", pattern: "pattern" }, motions: { outfit: "outfit" } },
};
const EMPTY = ["bald", "none"];
let state = { seed: 0, parts: {}, art: "" };
let block = null;
let tab = "dress";
let motions = {};
let play = {};
let timer = null;

const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/";
const CODE = ["__init__.py", "avatar.py", "motion.py", "service.py", "photo.py"];
const CASCADES = ["frontalface_default", "eye", "smile"].map(name => `cascades/haarcascade_${name}.xml`);
const params = (extra = {}) => ({ seed: String(state.seed), ...state.parts, ...extra });
const ROUTES = {
  motions: () => "motions",
  avatar: p => "avatar?" + new URLSearchParams(p),
  options: (slot, p) => `options/${slot}?` + new URLSearchParams(p),
  animate: p => "animate?" + new URLSearchParams(p),
};
const server = fetch("health").then(res => res.ok).catch(() => false);
let python = null;
let vision = null;

const say = text => $("status").textContent = text;

const script = src => new Promise((resolve, reject) => document.head.append(make("script", { src, onload: resolve, onerror: reject })));

const copy = (py, files) => Promise.all(files.map(async file =>
  py.FS.writeFile(`/home/pyodide/app/${file}`, new Uint8Array(await (await fetch(`app/${file}`)).arrayBuffer()))));

const boot = () => python ??= (async () => {
  say("warming up python...");
  await script(PYODIDE + "pyodide.js");
  const py = await loadPyodide({ indexURL: PYODIDE });
  py.FS.mkdirTree("/home/pyodide/app/cascades");
  await copy(py, CODE);
  py.runPython("import sys; sys.path.insert(0, '/home/pyodide')");
  say("");
  return { py, service: py.pyimport("app.service") };
})();

const local = async (name, args) => {
  const { py, service } = await boot();
  if (name === "photo") await (vision ??= Promise.all([py.loadPackage(["numpy", "opencv-python"]), copy(py, CASCADES)]));
  try {
    const out = service[name](...args.map(arg => typeof arg === "object" ? py.toPy(arg) : arg));
    return out.toJs({ dict_converter: Object.fromEntries });
  } catch (error) {
    throw new Error(error.message.trim().split("\n").pop().split(": ").slice(1).join(": "));
  }
};

const api = async (name, ...args) => {
  if (!await server) return local(name, args);
  const res = name === "photo"
    ? await fetch("photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: args[0] }) })
    : await fetch(ROUTES[name](...args));
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail);
  return body;
};

const draw = (el, art) => {
  const lines = art.split("\n");
  el.style.setProperty("--cols", [...lines[0]].length);
  el.replaceChildren(...[...lines.join("")].map(ch => make("span", { textContent: ch })));
  return el;
};

const preview = art => {
  const lines = art.split("\n");
  const size = Math.min(72 / lines.length, 76 / ([...lines[0]].length * .82));
  const el = draw(make("div", { className: "art" }), art);
  el.style.setProperty("--cell", Math.max(3, Math.min(14, Math.floor(size))) + "px");
  return el;
};

const diagram = () => {
  $("diagram").replaceChildren(...Object.entries(BLOCKS).map(([name, { box, slots, feature }]) => {
    const [x, y, w, h] = box;
    const main = Object.keys(slots)[0];
    const el = make("button", { className: "block", title: name, ariaLabel: name, onclick: () => open(block === name ? null : name) });
    el.classList.toggle("feature", !!feature);
    el.classList.toggle("active", block === name);
    el.classList.toggle("empty", EMPTY.includes(state.parts[main]));
    Object.entries({ x, y, w, h }).forEach(([key, value]) => el.style.setProperty("--" + key, value));
    return el;
  }));
};

const chip = (text, active, onclick, extra = "") => make("button", { textContent: text, className: (active ? "active " : "") + extra, onclick });

const section = (title, ...children) => {
  const el = make("section");
  el.append(make("h3", { textContent: title }), ...children);
  return el;
};

const dress = async () => {
  const slots = Object.entries(BLOCKS[block].slots);
  const all = await Promise.all(slots.map(([slot]) => api("options", slot, params())));
  $("dress").replaceChildren(...slots.map(([slot, title], i) => {
    const grid = make("div", { className: "grid" });
    grid.append(...all[i].map(({ name, art }) => {
      const tile = make("button", { className: "tile" + (state.parts[slot] === name ? " active" : ""), onclick: () => { state.parts[slot] = name; show(); } });
      tile.append(preview(art), make("span", { className: "name", textContent: name }));
      return tile;
    }));
    return section(title, grid);
  }));
};

const moves = () => {
  const sections = Object.entries(BLOCKS[block].motions).map(([feature, title]) => {
    const row = make("div", { className: "chips" });
    row.append(
      chip("still", !play[feature], () => { delete play[feature]; animate(); }),
      ...motions[feature].map(action => chip(action, play[feature] === action, () => { play[feature] = action; animate(); })));
    return section(title, row);
  });
  const active = Object.entries(play);
  const playing = make("div", { className: "chips" });
  playing.append(...active.map(([name, action]) => chip(`${name} · ${action} ×`, true, () => { delete play[name]; animate(); })));
  if (active.length) playing.append(chip("stop all", false, () => { play = {}; animate(); }, "stop"));
  else playing.append(make("p", { className: "hint", textContent: "nothing yet. mix as many as you like." }));
  $("animate").replaceChildren(...sections, section("playing", playing));
};

const panel = () => {
  diagram();
  $("panel").classList.toggle("open", !!block);
  if (!block) return;
  $("heading").textContent = block;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("dress").hidden = tab !== "dress";
  $("animate").hidden = tab !== "animate";
  if (tab === "dress") dress();
  else moves();
};

const open = name => {
  block = name;
  panel();
};

const animate = async () => {
  if (block && tab === "animate") moves();
  clearInterval(timer);
  const entries = Object.entries(play);
  if (!entries.length) return draw($("art"), state.art);
  const { fps, frames } = await api("animate", params({ play: entries.map(e => e.join(":")).join(",") }));
  let i = 0;
  const tick = () => draw($("art"), frames[i++ % frames.length]);
  tick();
  timer = setInterval(tick, 1000 / fps);
};

const apply = body => {
  state = body;
  panel();
  animate();
};

const show = async (fresh = false) => apply(await api("avatar", fresh ? {} : params()));

const shrink = file => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 768 / Math.max(img.width, img.height));
    const canvas = make("canvas", { width: img.width * scale, height: img.height * scale });
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    resolve(canvas.toDataURL("image/jpeg", 0.85));
  };
  img.onerror = reject;
  img.src = URL.createObjectURL(file);
});

$("file").onchange = async () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  say("reading your face...");
  try {
    apply(await api("photo", await shrink(file)));
    say("");
  } catch (error) {
    say(error.message || "could not read that photo");
  }
};

document.querySelectorAll(".tabs button").forEach(button => button.onclick = () => { tab = button.dataset.tab; panel(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") open(null); });
$("close").onclick = () => open(null);
$("snap").onclick = () => $("file").click();
$("shuffle").onclick = () => show(true);
$("copy").onclick = async () => {
  await navigator.clipboard.writeText(state.art);
  say("copied!");
  setTimeout(() => say(""), 900);
};
api("motions").then(body => { motions = body; show(true); });
</script>
</body>
</html>
