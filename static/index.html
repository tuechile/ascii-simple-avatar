<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii avatar</title>
<style>
:root {
  --white: #ffffff;
  --black: #000000;
  --blue: #0000ee;
  --glyph: "Courier New", Courier, monospace;
  --text: "Times New Roman", Times, serif;
}
* { box-sizing: border-box; border-radius: 0; }
body { margin: 0; min-height: 100vh; background: var(--white); color: var(--black); font-family: var(--text); font-size: 16px; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; padding: 0; cursor: pointer; background: none; }
button:focus-visible { outline: 1px dotted var(--black); outline-offset: 2px; }
.link { color: var(--blue); text-decoration: underline; }
.link:active { color: #ee0000; }
.link.active { color: var(--black); text-decoration: none; font-weight: bold; cursor: default; }
main { min-height: 100vh; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem; padding: 1.5rem 16px; }
.diagram { justify-self: center; position: relative; width: min(220px, 60vw); aspect-ratio: 330 / 470; }
.block { position: absolute; left: calc(var(--x) * 100% / 330); top: calc(var(--y) * 100% / 470); width: calc(var(--w) * 100% / 330); height: calc(var(--h) * 100% / 470); background: var(--black); }
.block.feature { background: var(--white); }
.block.circle { border-radius: 50%; }
.block:hover { opacity: .7; }
.block.empty { opacity: .3; }
.block.active, .block.active:hover { background: var(--blue); opacity: 1; }
.stage { display: grid; justify-items: center; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
.card { width: min(220px, 70vw); aspect-ratio: 320 / 408; background: var(--black); display: grid; place-items: center; }
.art { display: grid; grid-template-columns: repeat(var(--cols, 17), calc(var(--cell) * .82)); grid-auto-rows: var(--cell); font-family: var(--glyph); font-size: calc(var(--cell) * 1.25); line-height: var(--cell); font-weight: bold; }
.art span { text-align: center; }
.card .art { --cell: min(10px, 3vw); color: var(--white); }
.status { font-style: italic; min-height: 1.2em; }
h1 { margin: 0; font-size: 2em; font-weight: bold; text-align: center; }
.panel { position: fixed; right: 0; top: 12vh; height: 74vh; width: min(320px, 28vw); background: var(--white); border: 1px solid var(--black); border-right: 0; display: flex; flex-direction: column; transform: translateX(105%); z-index: 2; }
.panel.open { transform: none; }
.panel header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 4px; }
.panel h2 { margin: 0; font-size: 1.5em; }
.tabs { display: flex; gap: 6px; padding: 0 14px 10px; }
.body { overflow-y: auto; padding: 0 14px 14px; display: grid; gap: 14px; align-content: start; }
.body h3 { margin: 0 0 6px; font-size: 1em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.tile { aspect-ratio: 1; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 4px 3px 3px; }
.tile .name { color: var(--blue); text-decoration: underline; font-size: .85em; }
.tile.active { background: var(--blue); color: var(--white); }
.tile.active .name { color: var(--white); text-decoration: none; font-weight: bold; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.hint { margin: 0; font-style: italic; }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; gap: 2rem; }
  .diagram { order: 2; width: min(200px, 56vw); }
  .panel { top: auto; bottom: 0; left: 0; width: 100%; height: 55vh; border-right: 1px solid var(--black); border-bottom: 0; transform: translateY(105%); }
}
</style>
</head>
<body>
<main>
<section class="diagram" id="diagram" aria-label="pick a part"></section>
<section class="stage">
<h1>ASCII AVATAR</h1>
<div class="tools">
<button class="link" id="shuffle">shuffle</button>
<button class="link" id="snap">from photo</button>
<button class="link" id="copy">copy text</button>
<button class="link" id="css">copy css</button>
<input type="file" id="file" accept="image/*" capture="user" hidden>
</div>
<div class="card"><div class="art" id="art"></div></div>
<nav class="tools" id="turns">
<button class="link" data-turn="-2" aria-label="turn left 90 degrees">&lt;&lt;</button>
<button class="link" data-turn="-1" aria-label="turn left 45 degrees">&lt;</button>
<button class="link" data-turn="0">front</button>
<button class="link" data-turn="1" aria-label="turn right 45 degrees">&gt;</button>
<button class="link" data-turn="2" aria-label="turn right 90 degrees">&gt;&gt;</button>
</nav>
<span class="status" id="status"></span>
</section>
</main>
<aside class="panel" id="panel" aria-live="polite">
<header><h2 id="heading"></h2><button class="link" id="close">close</button></header>
<nav class="tabs">
[<button class="link active" data-tab="dress">dress</button>] [<button class="link" data-tab="animate">animate</button>]
</nav>
<div class="body" id="dress"></div>
<div class="body" id="animate" hidden></div>
</aside>
<script>
const $ = id => document.getElementById(id);
const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const BLOCKS = {
  hair: { box: [32, 0, 270, 58], slots: { hair: "style", texture: "texture" }, motions: { hair: "hair" } },
  face: { box: [54, 65, 213, 214], slots: { face: "shape", line: "line" }, motions: { body: "whole avatar" } },
  ears: { box: [0, 120, 37, 82], slots: { ears: "ears" }, motions: { ears: "ears" } },
  eyes: { box: [139, 119, 51, 37], slots: { eyes: "eyes" }, motions: { eyes: "eyes" }, feature: true },
  cheeks: { box: [81, 169, 47, 45], slots: { cheeks: "cheeks" }, motions: { cheeks: "cheeks" }, feature: true },
  nose: { box: [165, 169, 17, 46], slots: { nose: "nose" }, motions: { nose: "nose" }, feature: true },
  mouth: { box: [113, 232, 88, 25], slots: { mouth: "mouth" }, motions: { mouth: "mouth" }, feature: true },
  accessory: { box: [285, 141, 44, 44], slots: { glasses: "glasses", earrings: "earrings", top: "hat" }, motions: { glasses: "glasses", earrings: "earrings", top: "hat" }, circle: true },
  body: { box: [27, 332, 303, 138], slots: { outfit: "shape", pattern: "pattern" }, motions: { outfit: "outfit" } },
};
const EMPTY = ["bald", "none"];
let state = { seed: 0, parts: {}, turn: 0, art: "" };
let block = null;
let tab = "dress";
let motions = {};
let play = {};
let timer = null;

const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/";
const CODE = ["__init__.py", "avatar.py", "motion.py", "service.py", "photo.py"];
const CASCADES = ["frontalface_default", "eye", "smile"].map(name => `cascades/haarcascade_${name}.xml`);
const params = (extra = {}) => ({ seed: String(state.seed), turn: String(state.turn), ...state.parts, ...extra });
const ROUTES = {
  motions: () => "motions",
  avatar: p => "avatar?" + new URLSearchParams(p),
  options: (slot, p) => `options/${slot}?` + new URLSearchParams(p),
  animate: p => "animate?" + new URLSearchParams(p),
};
const server = fetch("health").then(res => res.ok).catch(() => false);
let python = null;
let vision = null;

const say = text => $("status").textContent = text;

const script = src => new Promise((resolve, reject) => document.head.append(make("script", { src, onload: resolve, onerror: reject })));

const copy = (py, files) => Promise.all(files.map(async file =>
  py.FS.writeFile(`/home/pyodide/app/${file}`, new Uint8Array(await (await fetch(`app/${file}`)).arrayBuffer()))));

const boot = () => python ??= (async () => {
  say("warming up python...");
  await script(PYODIDE + "pyodide.js");
  const py = await loadPyodide({ indexURL: PYODIDE });
  py.FS.mkdirTree("/home/pyodide/app/cascades");
  await copy(py, CODE);
  py.runPython("import sys; sys.path.insert(0, '/home/pyodide')");
  say("");
  return { py, service: py.pyimport("app.service") };
})();

const local = async (name, args) => {
  const { py, service } = await boot();
  if (name === "photo") await (vision ??= Promise.all([py.loadPackage(["numpy", "opencv-python"]), copy(py, CASCADES)]));
  try {
    const out = service[name](...args.map(arg => typeof arg === "object" ? py.toPy(arg) : arg));
    return out.toJs({ dict_converter: Object.fromEntries });
  } catch (error) {
    throw new Error(error.message.trim().split("\n").pop().split(": ").slice(1).join(": "));
  }
};

const api = async (name, ...args) => {
  if (!await server) return local(name, args);
  const res = name === "photo"
    ? await fetch("photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: args[0] }) })
    : await fetch(ROUTES[name](...args));
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail);
  return body;
};

const draw = (el, art) => {
  const lines = art.split("\n");
  el.style.setProperty("--cols", [...lines[0]].length);
  el.replaceChildren(...[...lines.join("")].map(ch => make("span", { textContent: ch })));
  return el;
};

const preview = art => {
  const lines = art.split("\n");
  const size = Math.min(52 / lines.length, 56 / ([...lines[0]].length * .82));
  const el = draw(make("div", { className: "art" }), art);
  el.style.setProperty("--cell", Math.max(2, Math.min(11, Math.floor(size))) + "px");
  return el;
};

const diagram = () => {
  $("diagram").replaceChildren(...Object.entries(BLOCKS).map(([name, { box, slots, feature, circle }]) => {
    const [x, y, w, h] = box;
    const el = make("button", { className: "block", title: name, ariaLabel: name, onclick: () => open(block === name ? null : name) });
    el.classList.toggle("feature", !!feature);
    el.classList.toggle("circle", !!circle);
    el.classList.toggle("active", block === name);
    el.classList.toggle("empty", (circle ? Object.keys(slots) : Object.keys(slots).slice(0, 1)).every(slot => EMPTY.includes(state.parts[slot])));
    Object.entries({ x, y, w, h }).forEach(([key, value]) => el.style.setProperty("--" + key, value));
    return el;
  }));
};

const chip = (text, active, onclick) => make("button", { textContent: text, className: "link" + (active ? " active" : ""), onclick });

const section = (title, ...children) => {
  const el = make("section");
  el.append(make("h3", { textContent: title }), ...children);
  return el;
};

const dress = async () => {
  const slots = Object.entries(BLOCKS[block].slots);
  const all = await Promise.all(slots.map(([slot]) => api("options", slot, params())));
  $("dress").replaceChildren(...slots.map(([slot, title], i) => {
    const grid = make("div", { className: "grid" });
    grid.append(...all[i].map(({ name, art }) => {
      const tile = make("button", { className: "tile" + (state.parts[slot] === name ? " active" : ""), onclick: () => { state.parts[slot] = name; show(); } });
      tile.append(preview(art), make("span", { className: "name", textContent: name }));
      return tile;
    }));
    return section(title, grid);
  }));
};

const moves = () => {
  const sections = Object.entries(BLOCKS[block].motions).map(([feature, title]) => {
    const row = make("div", { className: "chips" });
    row.append(
      chip("still", !play[feature], () => { delete play[feature]; animate(); }),
      ...motions[feature].map(action => chip(action, play[feature] === action, () => { play[feature] = action; animate(); })));
    return section(title, row);
  });
  const active = Object.entries(play);
  const playing = make("div", { className: "chips" });
  playing.append(...active.map(([name, action]) => chip(`${name} · ${action} ×`, false, () => { delete play[name]; animate(); })));
  if (active.length) playing.append(chip("stop all", false, () => { play = {}; animate(); }));
  else playing.append(make("p", { className: "hint", textContent: "nothing yet. mix as many as you like." }));
  $("animate").replaceChildren(...sections, section("playing", playing));
};

const panel = () => {
  diagram();
  $("panel").classList.toggle("open", !!block);
  if (!block) return;
  $("heading").textContent = block;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("dress").hidden = tab !== "dress";
  $("animate").hidden = tab !== "animate";
  if (tab === "dress") dress();
  else moves();
};

const open = name => {
  block = name;
  panel();
};

const animate = async () => {
  if (block && tab === "animate") moves();
  clearInterval(timer);
  const entries = Object.entries(play);
  if (!entries.length) return draw($("art"), state.art);
  const { fps, frames } = await api("animate", params({ play: entries.map(e => e.join(":")).join(",") }));
  let i = 0;
  const tick = () => draw($("art"), frames[i++ % frames.length]);
  tick();
  timer = setInterval(tick, 1000 / fps);
};

const apply = body => {
  state = body;
  document.querySelectorAll("#turns button").forEach(b => b.classList.toggle("active", Number(b.dataset.turn) === state.turn));
  panel();
  animate();
};

const show = async (fresh = false) => apply(await api("avatar", fresh ? { turn: String(state.turn) } : params()));

const shrink = file => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 768 / Math.max(img.width, img.height));
    const canvas = make("canvas", { width: img.width * scale, height: img.height * scale });
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    resolve(canvas.toDataURL("image/jpeg", 0.85));
  };
  img.onerror = reject;
  img.src = URL.createObjectURL(file);
});

$("file").onchange = async () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  say("reading your face...");
  try {
    apply(await api("photo", await shrink(file)));
    say("");
  } catch (error) {
    say(error.message || "could not read that photo");
  }
};

document.querySelectorAll(".tabs button").forEach(button => button.onclick = () => { tab = button.dataset.tab; panel(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") open(null); });
$("close").onclick = () => open(null);
document.querySelectorAll("#turns button").forEach(button => button.onclick = () => { state.turn = Number(button.dataset.turn); show(); });
$("snap").onclick = () => $("file").click();
$("shuffle").onclick = () => show(true);
const css = art => `.ascii-avatar::before {
  content: "${art.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\A ")}";
  display: inline-block;
  white-space: pre;
  font: bold 14px/1 "Courier New", Courier, monospace;
  color: #ffffff;
  background: #000000;
  padding: 2em 1.5em;
}`;

const clip = async text => {
  await navigator.clipboard.writeText(text);
  say("copied!");
  setTimeout(() => say(""), 900);
};

$("copy").onclick = () => clip(state.art);
$("css").onclick = () => clip(css(state.art));
api("motions").then(body => { motions = body; show(true); });
</script>
</body>
</html>
